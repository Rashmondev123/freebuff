<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeBuff — Log In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <a href="landing.html" class="auth-logo">FreeBuff</a>

        <div class="auth-toggle">
            <button id="tab-login" class="auth-tab active">Log In</button>
            <button id="tab-signup" class="auth-tab">Sign Up</button>
        </div>

        <form id="login-form" class="auth-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" required>

            <p id="login-error" class="auth-error"></p>

            <button type="submit" class="auth-submit">Log In</button>
        </form>

        <form id="signup-form" class="auth-form hidden">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required>

            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required>

            <p id="signup-error" class="auth-error"></p>

            <button type="submit" class="auth-submit">Create Account</button>
        </form>
    </div>

    <script src="auth.js"></script>
</body>
</html>
